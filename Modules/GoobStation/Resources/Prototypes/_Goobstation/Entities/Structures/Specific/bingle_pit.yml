- type: entity
  id: BinglePit
  categories: [ Spawner ] # needed so tests don't sus
  name: bingle pit
  description: Looks Hungry
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - WallLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Sprite
    drawdepth: FloorTiles
    layers:
    - sprite: Mobs/Bingle/bingle_pit.rsi
      state: pit
  - type: Appearance
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:EmptyContainersBehaviour
        containers:
        - chasm
      - !type:SpawnEntitiesBehavior
        spawn:
          CrateFunBingleLoot:
            min: 1
            max: 1
  - type: PassiveDamage #passive Healing
    damage:
      types:
        Blunt: -1
        Slash: -1
        Piercing: -1
        Heat: -1
        Shock: -1
        Structural: -1
  - type: Drain # remove liquids around pit
    unitsPerSecond: 10
    unitsDestroyedPerSecond: 10
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: RequireProjectileTarget
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.4
  - type: ContainerContainer
    containers:
      chasm: !type:Container
  - type: Chasm
  - type: ChasmContainer
    containerId: chasm
  - type: ContainerComponentGrant
    components:
    - type: Stunned # Prevents anyone from destroying the bingle pit from the inside
  - type: AntiRottingContainer
  - type: TriggerOnInsertedIntoContainer
    containerId: chasm
  - type: TriggerCounter
    keysIn:
    - trigger
    countKeys:
    - trigger
    - spawn
    - growth
  - type: TriggerOnCondition
    keysIn: # Triggers the checks
    - trigger
    triggers:
      # Triggers 10 times -> spawns a bingle and resets "spawn"
      spawn:
      - !type:TriggerCountCondition
        key: spawn
        count:
          min: 10
          max: 10
      # Triggers 100 times -> grows in size and resets "growth"
      growth:
      - !type:TriggerCountCondition
        key: growth
        count:
          min: 100
          max: 100
      # Triggers 200 times -> upgrade all bingles
      upgrade:
      - !type:TriggerCountCondition
        key: trigger # Triggers only once, so tracks the default key
        count:
          min: 200
          max: 200
      # Triggers 500 times -> ascension announcement
      announce:
      - !type:TriggerCountCondition
        key: trigger # Triggers only once, so tracks the default key
        count:
          min: 500
          max: 500
  - type: ResetCounterOnTrigger
    keysIn:
    - spawn
    - growth
    reset:
      spawn:
      - spawn
      growth:
      - growth
  - type: SpawnOnTrigger
    keysIn:
    - spawn
    proto: SpawnPointGhostBingle
  - type: SpawnerLink
  - type: AnnounceOnTrigger
    keysIn:
    - announce
    message: bingle-pit-ascension
    sender: bingle-pit-ascension-sender
    sound:
      path: /Audio/Ambience/Antag/Heretic/ascend_flesh.ogg
    color: Pink
  - type: EntityEffectOnTrigger
    keysIn:
    - growth
    effects:
    - !type:ScaleSprite
      scale: 1.25, 1.25
  - type: LinkedEntityEffectOnTrigger
    keysIn:
    - upgrade
    effects:
    - !type:Polymorph
      prototype: BingleUpgraded
      conditions:
      - !type:MobStateCondition
      - !type:TagCondition
        tag: Bingle
    - !type:Polymorph
      prototype: TurkleUpgraded
      conditions:
      - !type:MobStateCondition
      - !type:TagCondition
        tag: Turkle
  - type: TileReplaceOnTrigger
    keysIn:
    - trigger
    tile: FloorBingle
    radiusCounterScaling: true
    radiusCounterModifier: 0.05
    prob: 0.02
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
  - type: WarpPoint
    location: bingle pit
  - type: Tag
    tags:
    - BinglePit
