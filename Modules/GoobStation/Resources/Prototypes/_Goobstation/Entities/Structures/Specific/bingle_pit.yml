- type: entity
  id: BinglePit
  categories: [ Spawner ] # needed so tests don't sus
  name: bingle pit
  description: Looks Hungry
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - WallLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: Sprite
    drawdepth: FloorTiles
    layers:
    - sprite: Mobs/Bingle/bingle_pit.rsi
      state: pit
  - type: Appearance
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:EmptyContainersBehaviour
        containers:
        - chasm
      - !type:SpawnEntitiesBehavior
        spawn:
          CrateFunBingleLoot:
            min: 1
            max: 1
  - type: PassiveDamage #passive Healing
    damage:
      groups:
        Brute: -3
      types:
        Heat: -1
        Shock: -1
        Structural: -1
  - type: Drain # remove liquids around pit
    unitsPerSecond: 10
    unitsDestroyedPerSecond: 10
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: RequireProjectileTarget
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.4
  - type: ContainerContainer
    containers:
      chasm: !type:Container
  - type: Chasm
  - type: ChasmContainer
    containerId: chasm
  - type: ContainerComponentGrant
    components:
    - type: Stunned
  - type: TriggerOnInsertedIntoContainer
    containerId: chasm
  - type: TriggerCounter
    keys:
    - trigger
  - type: TriggerOnCounter
    keyOut: announce
    ranges:
      trigger:
        min: 500
        max: 500
  - type: AnnounceOnTrigger
    keysIn:
    - announce
    message: bingle-pit-ascension
    sender: bingle-pit-ascension-sender
    sound:
      path: /Audio/Ambience/Antag/Heretic/ascend_flesh.ogg
    color: Pink
  - type: TileReplaceOnTrigger
    keysIn:
    - trigger
    tile: FloorBingle
    radiusCounterScaling: true
    radiusCounterModifier: 0.05
    prob: 0.04
  - type: AntiRottingContainer
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
  - type: WarpPoint
    location: bingle pit
  - type: Tag
    tags:
    - BinglePit
