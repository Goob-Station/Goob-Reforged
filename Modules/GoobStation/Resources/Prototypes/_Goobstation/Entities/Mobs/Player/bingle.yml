# Base bingle
- type: entity
  name: bingle
  id: MobBingle
  parent: MobSpaceBasic
  description: bingle
  components:
  #- type: Bingle
  #  upgradedID: MobBingleUpgraded
  - type: GhostTakeoverAvailable
  - type: GhostRole
    name: ghost-role-information-bingle-name
    description: ghost-role-information-bingle-description
    rules: ghost-role-information-bingle-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Bingle/bingle.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: alive
    - map: ["enum.CombatModeLayers.Layer"]
      state: combat
      visible: false
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Nitrogen
        Quantity: 100
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    wideAnimationRotation: 0
    animation: WeaponArcSlash
    damage:
      types:
        Blunt: 7
        Structural: 14 # breaks down the walls and airlocks in 10 hits
        Ion: 5
    bluntStaminaDamageFactor: 2.0
  - type: MovementSpeedModifier
    baseWalkSpeed : 2 # same as slime
    baseSprintSpeed : 4
  #- type: Sprinter
  #  staminaDrainRate: 27 #fat legs
  - type: Stamina
    baseCritThreshold: 120
  - type: StaminaDamageOnHit # Should consistently stamcrit in 3 hits, 4-5 against sec
    damage: 25
    sound: /Audio/Weapons/egloves.ogg
  - type: Damageable
    damageModifierSet: Bingle
  - type: Injurable
    damageContainer: Biological
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Footsteps/slime1.ogg
      params:
        volume: 3
  - type: TypingIndicator
    proto: alien
  - type: Speech
    speechVerb: Bingle
    speechSounds: Slime
  #- type: LanguageKnowledge
  #  speaks:
  #  - Bingle
  #  understands:
  #  - TauCetiBasic
  #- type: CollectiveMind
  #  defaultChannel: Binglemind
  #  respectAccents: true
  #  channels:
  #  - Binglemind
  - type: PassiveDamage #passive Healing
    allowedStates:
    - Alive
    damage:
      types:
        Blunt: -0.5
        Slash: -0.5
        Piercing: -0.5
        Heat: -0.5
        Shock: -0.5
        Caustic: -0.5
        Poison: -0.5
  #- type: NightVision
  #  color: "#008080"
  #  activateSound: null
  #  deactivateSound: null
  - type: FlashImmunity
  #- type: Butcherable
  #  spawned:
  #  - id: FoodMeatBingle
  #    amount: 3
  - type: StepTriggerImmune
    whitelist:
      tags:
      - BinglePit
  - type: CombatModeVisuals
  - type: GenericVisualizer
    visuals:
      enum.CombatModeVisuals.Combat:
        enum.CombatModeLayers.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Tag
    tags:
    - DoorBumpOpener
    - Bingle

- type: entity
  id: MobBingleUpgraded
  parent: MobBingle
  suffix: Upgraded
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Bingle/bingle.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: Upgraded
    - map: [ "enum.CombatModeLayers.Layer" ]
      state: combat
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: Upgraded
      Dead:
        Base: dead_upgraded
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    wideAnimationRotation: 0
    animation: WeaponArcSlash
    damage:
      types:
        Blunt: 14
        Structural: 28
        Ion: 7
  - type: Damageable
    damageModifierSet: BingleUpgraded

- type: polymorph
  id: BingleUpgraded
  configuration:
    entity: MobBingleUpgraded
    forced: true
    inventory: None
    revertOnCrit: false
    revertOnDeath: false
    polymorphPopup: null

# Skin - turkle
- type: entity
  name: turkle
  id: MobTurkle
  parent: MobBingle
  description: A bingle from foreign lands lost to time. Seems very proud of their homeland.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Bingle/turkle.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: alive
    - map: ["enum.CombatModeLayers.Layer"]
      state: combat
      visible: false
  #- type: NightVision
  #  color: "#802000"
  #  activateSound: null
  #  deactivateSound: null
  - type: PointLight
    radius: 1.2
    energy: 2
    color: "#ad2a33"
  - type: Tag
    tags:
    - DoorBumpOpener
    - Turkle

- type: entity
  id: MobTurkleUpgraded
  parent: MobBingleUpgraded
  suffix: Upgraded
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Bingle/turkle.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: Upgraded
    - map: [ "enum.CombatModeLayers.Layer" ]
      state: combat
      visible: false

- type: polymorph
  id: TurkleUpgraded
  configuration:
    entity: MobTurkleUpgraded
    forced: true
    inventory: None
    revertOnCrit: false
    revertOnDeath: false
    polymorphPopup: null
