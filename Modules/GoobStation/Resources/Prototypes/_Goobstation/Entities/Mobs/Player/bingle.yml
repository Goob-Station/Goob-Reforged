- type: entity
  id: MobBingleRandom
  parent: MarkerBase
  name: bingle
  suffix: Random
  components:
  - type: Sprite
    sprite: Mobs/Bingle/bingle.rsi
    state: alive
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - id: MobBingle
        weight: 49    # 49/50
      - id: MobTurkle
        weight: 1     # 01/50

# Base bingle
- type: entity
  name: bingle
  id: MobBingle
  parent: MobSpaceBasic
  description: bingle
  components:
  #- type: Bingle
  #  upgradedID: MobBingleUpgraded
  - type: GhostTakeoverAvailable
  - type: GhostRole
    name: ghost-role-information-bingle-name
    description: ghost-role-information-bingle-description
    rules: ghost-role-information-bingle-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Bingle/bingle.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: alive
    #- map: ["enum.BingleVisual.Upgraded"]
    #  state: Upgraded
    #  visible: false
    - map: ["enum.CombatModeVisuals.Combat"]
      state: combat
      visible: false
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Dead:
        Base: dead
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Nitrogen
        Quantity: 100
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    wideAnimationRotation: 0
    animation: WeaponArcSlash
    damage:
      types:
        Blunt: 7
        Structural: 14 # breaks down the walls and airlocks in 10 hits
        Ion: 5
    bluntStaminaDamageFactor: 2.0
  - type: MovementSpeedModifier
    baseWalkSpeed : 2 # same as slime
    baseSprintSpeed : 4
  #- type: Sprinter
  #  staminaDrainRate: 27 #fat legs
  - type: Stamina
    baseCritThreshold: 120
  - type: StaminaDamageOnHit # Should consistently stamcrit in 3 hits, 4-5 against sec
    damage: 25
    sound: /Audio/Weapons/egloves.ogg
  - type: Damageable
    damageModifierSet: Bingle
  - type: Injurable
    damageContainer: Biological
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Footsteps/slime1.ogg
      params:
        volume: 3
  - type: TypingIndicator
    proto: alien
  - type: Speech
    speechVerb: Bingle
    speechSounds: Slime
  #- type: LanguageKnowledge
  #  speaks:
  #  - Bingle
  #  understands:
  #  - TauCetiBasic
  #- type: CollectiveMind
  #  defaultChannel: Binglemind
  #  respectAccents: true
  #  channels:
  #  - Binglemind
  - type: PassiveDamage #passive Healing
    allowedStates:
    - Alive
    damage:
      types:
        Blunt: -0.5
        Slash: -0.5
        Piercing: -0.5
        Heat: -0.5
        Shock: -0.5
        Caustic: -0.5
        Poison: -0.5
  #- type: NightVision
  #  color: "#008080"
  #  activateSound: null
  #  deactivateSound: null
  - type: FlashImmunity
  #- type: Butcherable
  #  spawned:
  #  - id: FoodMeatBingle
  #    amount: 3
  - type: StepTriggerImmune
    whitelist:
      tags:
      - BinglePit

- type: entity
  id: MobBingleUpgraded
  parent: MobBingle
  suffix: Upgraded
  components:
  #- type: Bingle
  #  upgraded: true
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Bingle/bingle.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: Upgraded
    - map: [ "enum.CombatModeVisuals.Combat" ]
      state: combat
      visible: false
  - type: DamageStateVisuals
    states:
      Alive:
        Base: Upgraded
      Dead:
        Base: dead_upgraded
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    wideAnimationRotation: 0
    animation: WeaponArcSlash
    damage:
      types:
        Blunt: 14
        Structural: 28
        Ion: 7
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: BingleUpgraded

# Skin - turkle
- type: entity
  name: turkle
  id: MobTurkle
  parent: MobBingle
  description: A bingle from foreign lands lost to time. Seems very proud of their homeland.
  components:
  #- type: Bingle
  #  upgradedID: MobTurkleUpgraded
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Bingle/turkle.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: alive
    #- map: ["enum.BingleVisual.Upgraded"]
    #  state: Upgraded
    #  visible: false
    - map: ["enum.CombatModeVisuals.Combat"]
      state: combat
      visible: false
  #- type: NightVision
  #  color: "#802000"
  #  activateSound: null
  #  deactivateSound: null
  - type: PointLight
    radius: 1.2
    energy: 2
    color: "#ad2a33"

- type: entity
  id: MobTurkleUpgraded
  parent: MobBingleUpgraded
  suffix: Upgraded
  components:
  #- type: Bingle
  #  upgraded: true
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Bingle/turkle.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: Upgraded
    - map: [ "enum.CombatModeVisuals.Combat" ]
      state: combat
      visible: false
