name: Update REUSE Headers

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reuse-headers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update_headers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@v4
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            Tools/update_pr_reuse_headers.py
          sparse-checkout-cone-mode: false

      - name: Checkout PR files (data only, never executed)
        uses: actions/checkout@v4
        with:
          path: pr
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get changed files and PR info
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          echo "Fetching files for PR #${PR_NUMBER} in repo ${GH_REPO}"

          PR_FILES_JSON=$(curl -s -f -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${GH_REPO}/pulls/${PR_NUMBER}/files")

          : > added_files.list
          : > modified_files.list

          echo "$PR_FILES_JSON" \
            | jq -r '.[] | select(.filename != null) | "\(.status)\t\(.filename)"' \
            | while IFS=$'\t' read -r status file; do
                # Reject path traversal outright.
                case "$file" in
                  *..*) continue ;;
                esac
                # Allow-list: relative path, safe characters, correct extension.
                if [[ "$file" =~ ^[A-Za-z0-9_./-]+\.(cs|ya?ml)$ ]]; then
                  if [[ "$status" == "added" ]]; then
                    printf '%s\n' "$file" >> added_files.list
                  elif [[ "$status" == "modified" ]]; then
                    printf '%s\n' "$file" >> modified_files.list
                  fi
                fi
              done

          echo "Added files:"; cat added_files.list
          echo "Modified files:"; cat modified_files.list

          echo "Checking PR body for license..."
          if grep -q "LICENSE: MIT" <<< "$PR_BODY"; then
            echo "PR_LICENSE=mit" >> "$GITHUB_ENV"
            echo "License specified in PR: MIT"
          elif grep -q "LICENSE: AGPL" <<< "$PR_BODY"; then
            echo "PR_LICENSE=agpl" >> "$GITHUB_ENV"
            echo "License specified in PR: AGPL"
          elif grep -q "LICENSE: MPL" <<< "$PR_BODY"; then
            echo "PR_LICENSE=mpl" >> "$GITHUB_ENV"
            echo "License specified in PR: MPL"
          elif grep -q "LICENSE: GAG" <<< "$PR_BODY"; then
            echo "PR_LICENSE=gag" >> "$GITHUB_ENV"
            echo "License specified in PR: GAG"
          else
            echo "PR_LICENSE=agpl" >> "$GITHUB_ENV"
            echo "No license specified in PR, using default: AGPL"
          fi

      - name: Run REUSE header update script
        working-directory: pr
        run: |
          mapfile -t ADDED_FILES < ../added_files.list
          mapfile -t MODIFIED_FILES < ../modified_files.list

          python ../trusted/Tools/update_pr_reuse_headers.py \
            --files-added "${ADDED_FILES[@]}" \
            --files-modified "${MODIFIED_FILES[@]}" \
            --pr-license "${{ env.PR_LICENSE }}" \
            --pr-base-sha "${{ github.event.pull_request.base.sha }}" \
            --pr-head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Configure push credentials
        working-directory: pr
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf '%s' "x-access-token:${BOT_TOKEN}" | base64 -w0)"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: pr
          commit_message: "chore: Automatically update REUSE headers"
          commit_user_name: ${{ vars.CHANGELOG_USER }}
          commit_user_email: ${{ vars.CHANGELOG_EMAIL }}
          commit_author: ${{ vars.CHANGELOG_USER }} <${{ vars.CHANGELOG_EMAIL }}>
          skip_dirty_check: false
          skip_fetch: true
